# v* etiketi itildiğinde: derle, npm'e yayınla, FiveM/RedM resource zip'ini GitHub Release'e ekle.
#   git tag v1.2.0 && git push origin v1.2.0
# Gerekli gizli anahtar: NPM_TOKEN (npmjs.com > Access Tokens > Granular, streamemberplatform org'unda publish yetkili)
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      - name: Etiket ile package.json sürümü aynı mı?
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then echo "Etiket v$TAG ama package.json $PKG"; exit 1; fi

      - run: npm run build

      - name: FiveM/RedM resource paketi
        run: |
          npm run sync
          cd integration && zip -qr "../mhud-resource-${GITHUB_REF_NAME}.zip" mhud

      - name: npm publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: mhud-resource-${{ github.ref_name }}.zip
