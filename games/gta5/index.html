<!doctype html>
<html lang="tr" class="mh-nui">
<head>
<meta charset="utf-8">
<title>MHud · GTA V yayın düzeni</title>
<link rel="stylesheet" href="../../kit/css/mhud.css">
<link rel="stylesheet" href="../shared/mhgame.css">
</head>
<!--
  GTA V (FiveM) — etkileşimli yayın düzeni
  Sol alt köşe oyunun kendi radarına bırakılmıştır (demo modunda yer tutucu görünür).
  Veri: game:set { level, xp, xpMax, kills, deaths, wins, losses, hp, hpMax, armor, cash, bank,
                   wanted, onScreen, queued, maxEnemies, streak, wave }
  Olay: game:kill, game:gift, game:social, game:toast, game:announce, game:weapon, game:queue, game:objective…
  Parametre: ?theme=modern ?crop=vertical|square ?platform=tiktok ?ws=ws://127.0.0.1:8787 ?demo=1
-->
<body class="mh">
<div class="mh-screen" id="screen">
  <div class="mh-vignette" id="vignette"></div>

  <!-- Üst orta: yayıncı istatistikleri -->
  <div class="mh-anchor mh-tc" style="gap:10px">
    <div class="mh-statbar">
      <div class="mh-chip-stat mh-t-accent"><i data-i="xp"></i><b data-g="level">1</b><span>Seviye</span></div>
      <div class="mh-chip-stat mh-t-danger"><i data-i="kill"></i><b data-g="kills">0</b><span>Leş</span></div>
      <div class="mh-chip-stat"><i data-i="skull"></i><b data-g="deaths">0</b><span>Ölüm</span></div>
      <div class="mh-chip-stat mh-t-success"><i data-i="trophy"></i><b><span data-g="wins">0</span><small>–<span data-g="losses">0</span></small></b><span>G / M</span></div>
      <div class="mh-chip-stat mh-t-info mh-hide-vertical"><i data-i="wave"></i><b data-g="wave">1</b><span>Dalga</span></div>
    </div>
  </div>

  <!-- Üst sol: görev -->
  <div class="mh-anchor mh-tl mh-hide-crop" data-g-objective></div>

  <!-- Üst sağ: para, aranma, etki kuyruğu, bildirimler -->
  <div class="mh-anchor mh-tr mh-v-offset" style="gap:10px;--mh-v-offset:84px">
    <div class="mh-cash">
      <div class="mh-cash__value"><small>$</small><b data-g="cash">0</b></div>
      <div class="mh-cash__bank mh-hide-crop"><i data-i="bank"></i><span data-g="bank">0</span></div>
    </div>
    <div class="mh-wanted" data-g-level="wanted" data-hide-zero><i data-i="star"></i><i data-i="star"></i><i data-i="star"></i><i data-i="star"></i><i data-i="star"></i></div>
    <div class="mh-panel mh-queue mh-hide-vertical mh-hidden" data-g-queue="4" style="--w:310px;margin-top:6px">
      <div class="mh-panel__head" style="padding:10px 14px"><i data-i="queue"></i><span class="mh-kicker">Sıradaki olaylar</span></div>
      <div data-g-queue-list></div>
    </div>
    <div class="mh-toasts" data-mh="toasts" style="--w:330px;margin-top:6px"></div>
  </div>

  <!-- Sol orta: hediyeler + sosyal -->
  <div class="mh-anchor mh-ml" style="margin-top:-40px;gap:14px">
    <div class="mh-gifts" data-mh="gifts" style="--w:330px"></div>
    <div class="mh-social" data-mh="social"></div>
  </div>

  <!-- Sağ orta: ölüm akışı + eşya -->
  <div class="mh-anchor mh-mr mh-v-offset" style="margin-top:-40px;--mh-v-offset:-170px">
    <div class="mh-feed" data-mh="feed"></div>
    <div class="mh-pickups" data-mh="pickups" style="margin-top:14px"></div>
  </div>

  <div class="mh-anchor mh-mc"><div class="mh-crosshair"><i></i><i></i><i></i><i></i><b></b></div></div>

  <!-- Alt orta: düşman sayacı + can/zırh -->
  <div class="mh-anchor mh-bc" style="gap:10px">
    <div class="mh-panel mh-enemy" data-g-enemies>
      <div class="mh-enemy__part is-on"><i data-i="enemy"></i><div><b data-k="on">0</b><span>Ekranda</span></div></div>
      <div class="mh-enemy__part is-queue"><i data-i="hourglass"></i><div><b data-k="queued">0</b><span>Kuyrukta</span></div></div>
      <div class="mh-bar mh-t-danger"><i class="mh-bar__fill"></i></div>
    </div>
    <div class="mh-hpbig" style="--w:340px">
      <div class="mh-hpbig__head"><i data-i="heart"></i><b data-g="hp">100</b><span>/ <span data-g="hpMax">100</span></span></div>
      <div class="mh-bar mh-t-health" data-g-bar="hp" data-critical="25"><i class="mh-bar__ghost"></i><i class="mh-bar__fill"></i></div>
      <div class="mh-bar mh-bar--sm mh-t-armor" data-g-bar="armor" style="margin-top:4px"><i class="mh-bar__fill"></i></div>
    </div>
  </div>

  <!-- Sol alt: oyunun radarı için boş (demoda yer tutucu) -->
  <div class="mh-anchor mh-bl g-demo-only mh-hide-crop"><div class="g-radar"><img data-demo-src="../../demo/scenes/minimap.svg" alt=""></div></div>

  <!-- Sağ alt: seri + silah -->
  <div class="mh-anchor mh-br" style="gap:12px">
    <div class="mh-panel mh-streak mh-hidden mh-hide-vertical" data-g-streak data-decay="7000"><i data-i="streak"></i><span class="mh-streak__count">0</span><span class="mh-streak__label"><b>Seri</b><span class="mh-sub">Leş serisi</span></span><i class="mh-streak__decay"></i></div>
    <div class="mh-weapon mh-hidden mh-hide-vertical" data-g-weapon>
      <div class="mh-weapon__name"><span class="mh-weapon__reload" data-g-show="reloading">Şarjör değişiyor</span><span class="mh-kicker" data-g-weapon-label></span></div>
      <div class="mh-weapon__main">
        <span data-g-weapon-art></span>
        <div class="mh-weapon__ammo"><span class="mh-weapon__clip" data-g="clip" data-instant>0</span><span class="mh-weapon__reserve">/ <span data-g="reserve" data-instant>0</span></span></div>
      </div>
      <div class="mh-pips" data-g-pips="clip" style="gap:2px"></div>
    </div>
  </div>
</div>

<script src="../../kit/js/mhud-icons.js"></script>
<script src="../../kit/js/mhud.js"></script>
<script src="../../kit/js/mhud-social.js"></script>
<script src="../shared/mhgame.js"></script>
<script>
  MHGame.on('set', function (d) { if ('hp' in d) MH.vignette('#vignette', d.hp / (MHGame.state.hpMax || 100) * 100); });

  MHGame.boot({
    game: 'gta5', theme: 'modern', scene: 'city',
    defaults: { level: 1, kills: 0, deaths: 0, wins: 0, losses: 0, wave: 1, hp: 100, hpMax: 100, armor: 0, cash: 0, bank: 0, wanted: 0, onScreen: 0, queued: 0, maxEnemies: 20, streak: 0 },
    demo: function (G) {
      var S = { level: 24, kills: 132, deaths: 3, wins: 5, losses: 2, wave: 8, hp: 82, armor: 45, cash: 12480, bank: 1204900, wanted: 2, onScreen: 14, queued: 37, streak: 0 };
      var W = [{ name: 'carbine', label: 'Karabina tüfeği', clipMax: 30 }, { name: 'pistol', label: 'Savaş tabancası', clipMax: 12 }, { name: 'shotgun', label: 'Pompalı tüfek', clipMax: 8 }, { name: 'bat', label: 'Beyzbol sopası' }];
      var w = Object.assign({}, W[0], { clip: 24, reserve: 180 });
      var Q = [];
      var NAMES = ['NabeMedia', 'RAPAFI', 'MSK', 'anonim_42', 'serkan_tv', 'mira.live'];
      var GIFTS = [{ name: 'Gül', art: '🌹', tier: 'common', coins: 1, effect: '+1 düşman', effectIcon: 'enemy', add: 1 },
        { name: 'Donut', art: '🍩', tier: 'rare', coins: 30, effect: '+20 can', effectIcon: 'heart-plus', heal: 20 },
        { name: 'Roket', art: '🚀', tier: 'epic', coins: 1000, effect: 'Hava saldırısı', effectIcon: 'bomb', add: 8 },
        { name: 'Aslan', art: '🦁', tier: 'legendary', coins: 29999, effect: 'Boss geliyor', effectIcon: 'boss', add: 1, boss: true }];
      G.set(S);
      G.send('game:weapon', w);
      G.send('game:objective', { kicker: 'Hayatta kal', title: 'Dalga 8 · Vinewood', steps: [{ text: 'Dalgayı temizle', active: true, count: '14 kaldı' }, { text: 'Boss\'u indir', failed: false }, { text: 'Hiç ölmeden bitir (bonus)' }], progress: 42 });
      function sync() { G.set(S); G.send('game:queue', Q); }
      function kill() {
        if (S.onScreen <= 0) return;
        S.onScreen--; S.kills++; S.streak++; S.cash += 250;
        if (S.queued > 0) { S.queued--; S.onScreen++; }
        G.send('game:kill', { actor: 'Amiral Router', victim: G.pick(['Ballas #12', 'Vagos #4', 'Lost MC', 'Merryweather']), weapon: w.clip != null ? w.name : 'bat', headshot: Math.random() < .3, self: true });
        if (S.onScreen === 0 && S.queued === 0) { S.wins++; S.wave++; S.level++; S.onScreen = 10; S.queued = 20; G.send('game:announce', { kicker: 'Dalga temizlendi', title: 'Dalga ' + S.wave, sub: 'Zırhlı düşmanlar yaklaşıyor' }); }
        if (S.streak && S.streak % 10 === 0) G.send('game:toast', { tone: 'gold', icon: 'streak', title: S.streak + ' leş serisi!', text: '+%25 para bonusu' });
      }
      function shoot() {
        if (w.clip == null) return;
        if (w.clip <= 0) { w.reloading = true; G.send('game:weapon', w); setTimeout(function () { w.clip = w.clipMax; w.reserve -= w.clipMax; w.reloading = false; G.send('game:weapon', w); }, 1400); return; }
        w.clip--; G.send('game:weapon', w); if (Math.random() < .25) MH.hit('#screen');
      }
      function gift() {
        var g = G.pick(GIFTS), from = G.pick(NAMES);
        G.send('game:gift', Object.assign({ from: from }, g));
        Q.unshift({ icon: g.boss ? 'boss' : g.heal ? 'heart-plus' : 'enemy', text: g.effect + ' · ' + from, tone: g.boss ? 'danger' : g.heal ? 'success' : 'info', running: true, time: '0:0' + G.int(3, 9) });
        Q.forEach(function (x, i) { if (i) x.running = false; }); Q = Q.slice(0, 4);
        if (g.add) S.queued += g.add; if (g.heal) S.hp = Math.min(100, S.hp + g.heal);
      }
      function hurt() {
        var dmg = G.int(6, 18);
        if (S.armor > 0) S.armor = Math.max(0, S.armor - dmg); else S.hp -= dmg;
        G.send('game:damage', { angle: G.int(0, 359) });
        if (S.hp <= 0) { S.deaths++; S.losses++; S.hp = 100; S.armor = 50; S.streak = 0; G.send('game:announce', { kicker: 'Elendin', title: 'Öldün', sub: 'Yeniden doğuluyor…', tone: 'danger' }); }
      }
      setInterval(function () {
        var r = Math.random();
        if (r < .5) { shoot(); shoot(); kill(); } else if (r < .72) gift(); else if (r < .9) hurt(); else { S.wanted = G.int(0, 5); }
        if (Math.random() < .12) G.send('game:social', { kind: G.pick(['join', 'follow', 'share', 'sub']), name: G.pick(NAMES) });
        if (Math.random() < .08) { w = Object.assign({}, G.pick(W)); if (w.clipMax) { w.clip = w.clipMax; w.reserve = w.clipMax * 6; } G.send('game:weapon', w); }
        sync();
      }, 1300);
    }
  });
</script>
</body>
</html>
