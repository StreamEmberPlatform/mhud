<!doctype html>
<html lang="tr" class="mh-nui">
<head>
<meta charset="utf-8">
<title>MHud · Left 4 Dead yayın düzeni</title>
<link rel="stylesheet" href="../../kit/css/mhud.css">
<link rel="stylesheet" href="../shared/mhgame.css">
<style>
  .mh-screen[data-mh-crop="vertical"] [data-mh="infected"] { top: 30% !important; }
</style>
</head>
<!--
  Left 4 Dead 2 — ko-op hayatta kalma yayın düzeni.
  Source oyunlarında HTML arayüz yoktur: bu sayfa OBS tarayıcı kaynağı olarak (1920×1080, saydam)
  oyunun üstüne bindirilir ve veriyi WebSocket'ten alır:  index.html?ws=ws://127.0.0.1:8787
  (SourceMod eklentisi → küçük bir köprü sunucusu → bu sayfa; mesaj biçimi aynıdır.)
  Veri: game:set { level, kills, specials, deaths, wins, losses, chapter, hp, hpMax, temp, onScreen, queued, maxEnemies,
                   streak, rescue (saniye), reviving, revive (0-100) }
  Olay: game:team [hayatta kalanlar], game:loadout [yuvalar], game:infected, game:horde, game:kill, game:gift…
-->
<body class="mh">
<div class="mh-screen" id="screen">
  <div class="mh-vignette" id="vignette"></div>

  <!-- Üst orta: yayıncı istatistikleri -->
  <div class="mh-anchor mh-tc">
    <div class="mh-statbar">
      <div class="mh-chip-stat mh-t-accent"><i data-i="xp"></i><b data-g="level">1</b><span>Seviye</span></div>
      <div class="mh-chip-stat mh-t-danger"><i data-i="zombie"></i><b data-g="kills" data-compact>0</b><span>Leş</span></div>
      <div class="mh-chip-stat mh-t-warn mh-hide-vertical"><i data-i="biohazard"></i><b data-g="specials">0</b><span>Özel</span></div>
      <div class="mh-chip-stat"><i data-i="skull"></i><b data-g="deaths">0</b><span>Ölüm</span></div>
      <div class="mh-chip-stat mh-t-success"><i data-i="trophy"></i><b><span data-g="wins">0</span><small>–<span data-g="losses">0</span></small></b><span>G / M</span></div>
    </div>
  </div>

  <!-- Üst sol: hayatta kalanlar -->
  <div class="mh-anchor mh-tl mh-hide-vertical">
    <div class="mh-survivors" data-g-team="first-aid,pills,molotov"></div>
  </div>

  <!-- Üst sağ: kurtarma sayacı, olay kuyruğu, bildirimler -->
  <div class="mh-anchor mh-tr mh-v-offset" style="gap:10px;--mh-v-offset:84px">
    <div class="mh-panel mh-rescue mh-hidden" data-g-show="rescue">
      <span class="mh-rescue__icon"><i data-i="heli"></i></span>
      <div><span class="mh-kicker">Kurtarma</span><b data-g-timer="rescue" data-urgent="15">00:00</b></div>
    </div>
    <div class="mh-panel mh-queue mh-hide-crop mh-hidden" data-g-queue="4" style="--w:300px">
      <div class="mh-panel__head" style="padding:10px 14px"><i data-i="queue"></i><span class="mh-kicker">Sıradaki olaylar</span></div>
      <div data-g-queue-list></div>
    </div>
    <div class="mh-toasts mh-hide-vertical" data-mh="toasts" style="--w:320px"></div>
  </div>

  <!-- Sol orta: hediyeler + sosyal -->
  <div class="mh-anchor mh-ml mh-v-offset" style="margin-top:60px;gap:14px;--mh-v-offset:20px">
    <div class="mh-gifts" data-mh="gifts" style="--w:330px"></div>
    <div class="mh-social" data-mh="social"></div>
  </div>

  <!-- Sağ orta: ölüm akışı -->
  <div class="mh-anchor mh-mr mh-v-offset" style="margin-top:-20px;--mh-v-offset:-120px">
    <div class="mh-feed" data-mh="feed"></div>
  </div>

  <div class="mh-anchor mh-tc" data-mh="infected" style="top:18%"></div>
  <div class="mh-anchor mh-mc"><div class="mh-crosshair"><i></i><i></i><i></i><i></i><b></b></div></div>

  <!-- Orta alt üstü: ayağa kaldırma -->
  <div class="mh-anchor mh-bc mh-hidden" data-g-show="reviving" style="bottom:300px">
    <div class="mh-revive"><b data-g="reviveLabel">Ayağa kaldırılıyor</b><div class="mh-bar mh-t-health" data-g-bar="revive"><i class="mh-bar__fill"></i></div><small data-g="reviver"></small></div>
  </div>

  <!-- Alt orta: düşman sayacı + can -->
  <div class="mh-anchor mh-bc" style="gap:10px">
    <div class="mh-panel mh-enemy" data-g-enemies>
      <div class="mh-enemy__part is-on"><i data-i="zombie"></i><div><b data-k="on">0</b><span>Ekranda</span></div></div>
      <div class="mh-enemy__part is-queue"><i data-i="hourglass"></i><div><b data-k="queued">0</b><span>Sürüde</span></div></div>
      <div class="mh-bar mh-t-danger"><i class="mh-bar__fill"></i></div>
    </div>
    <div class="mh-hpbig" style="--w:340px">
      <div class="mh-hpbig__head"><i data-i="heart"></i><b data-g="hp">100</b><span>/ <span data-g="hpMax">100</span></span></div>
      <div class="mh-bar mh-t-health" data-g-bar="hp" data-critical="40"><i class="mh-bar__ghost"></i><i class="mh-bar__fill"></i></div>
    </div>
  </div>

  <!-- Sol alt: seri -->
  <div class="mh-anchor mh-bl mh-hide-vertical">
    <div class="mh-panel mh-streak mh-hidden" data-g-streak data-decay="5000"><i data-i="streak"></i><span class="mh-streak__count">0</span><span class="mh-streak__label"><b>Seri</b><span class="mh-sub">Zombi serisi</span></span><i class="mh-streak__decay"></i></div>
  </div>

  <!-- Sağ alt: eşya yuvaları -->
  <div class="mh-anchor mh-br mh-hide-vertical">
    <div class="mh-loadout" data-g-loadout></div>
  </div>
</div>

<script src="../../kit/js/mhud-icons.js"></script>
<script src="../../kit/js/mhud.js"></script>
<script src="../shared/mhgame.js"></script>
<script>
  MHGame.on('set', function (d) { if ('hp' in d) MH.vignette('#vignette', d.hp / (MHGame.state.hpMax || 100) * 100); });

  MHGame.boot({
    game: 'l4d2', theme: 'tactical', accent: 'crimson', scene: 'night',
    defaults: { level: 1, kills: 0, specials: 0, deaths: 0, wins: 0, losses: 0, hp: 100, hpMax: 100, onScreen: 0, queued: 0, maxEnemies: 30, streak: 0, rescue: 0, reviving: false, revive: 0 },
    demo: function (G) {
      var S = { level: 9, kills: 1840, specials: 37, deaths: 4, wins: 2, losses: 3, hp: 64, onScreen: 18, queued: 42, streak: 0 };
      var T = [{ name: 'Amiral Router', hp: 64, temp: 12, self: true, items: ['first-aid', 'molotov'] },
        { name: 'NabeMedia', hp: 88, items: ['first-aid', 'pills'] },
        { name: 'RAPAFI', hp: 22, items: ['pills'], state: null },
        { name: 'MSK', hp: 0, temp: 30, items: [], state: 'down' }];
      var L = [{ key: '1', art: 'w:shotgun', label: '8 / 56', active: true }, { key: '2', art: 'w:pistol', label: '∞' },
        { key: '3', art: 'i:molotov' }, { key: '4', art: 'i:first-aid' }, { key: '5', art: 'i:pills', empty: true }];
      var SPECIAL = [{ name: 'Hunter', icon: 'zombie', hint: 'Üstüne atlar' }, { name: 'Smoker', icon: 'fog', hint: 'Dili ile çeker' }, { name: 'Boomer', icon: 'biohazard', hint: 'Safra kusar' },
        { name: 'Charger', icon: 'bolt', hint: 'Bodoslama' }, { name: 'Spitter', icon: 'poison', hint: 'Asit tükürür' }, { name: 'Jockey', icon: 'zombie', hint: 'Sırtına biner' }];
      var NAMES = ['NabeMedia', 'RAPAFI', 'MSK', 'anonim_42', 'serkan_tv', 'mira.live'];
      var GIFTS = [{ name: 'Gül', art: '🌹', tier: 'common', coins: 1, effect: '+5 zombi', effectIcon: 'zombie', add: 5 },
        { name: 'İlaç', art: '💊', tier: 'rare', coins: 30, effect: '+50 geçici can', effectIcon: 'pills', heal: 30 },
        { name: 'Sürü', art: '🧟', tier: 'epic', coins: 2000, effect: 'Sürü çağrıldı', effectIcon: 'zombie', add: 30, horde: true },
        { name: 'Aslan', art: '🦁', tier: 'legendary', coins: 29999, effect: 'Tank geliyor', effectIcon: 'skull', tank: true }];
      var Q = [], reviving = false, rescue = 0;
      G.set(S); G.send('game:team', T); G.send('game:loadout', L);
      function kill() {
        var n = G.int(1, 3);
        S.onScreen = Math.max(0, S.onScreen - n); S.kills += n; S.streak += n;
        var pull = Math.min(S.queued, n); S.queued -= pull; S.onScreen += pull;
        if (Math.random() < .35) { S.specials++; G.send('game:kill', { actor: 'Amiral Router', victim: G.pick(SPECIAL).name, weapon: G.pick(['shotgun', 'pistol', 'smg']), headshot: Math.random() < .4, self: true }); }
        if (S.onScreen === 0 && S.queued === 0) { S.wins++; S.level++; S.onScreen = 20; S.queued = 30; G.send('game:announce', { kicker: 'Güvenli oda', title: 'Bölüm geçildi', sub: 'Kapıyı kapat · cephane topla' }); }
      }
      function gift() {
        var g = G.pick(GIFTS), from = G.pick(NAMES);
        G.send('game:gift', Object.assign({ from: from }, g));
        if (g.horde) G.send('game:horde', { title: 'Sürü geliyor!', sub: from + ' bir sürü gönderdi' });
        if (g.tank) G.send('game:infected', { name: 'Tank', icon: 'skull', boss: true, kicker: 'Tehlike · ' + from, hint: 'Ateşle yavaşlat' });
        if (g.heal) { T[0].temp = Math.min(100 - T[0].hp, (T[0].temp || 0) + g.heal); G.send('game:team', T); }
        if (g.add) S.queued += g.add;
        Q.unshift({ icon: g.tank ? 'skull' : g.heal ? 'pills' : 'zombie', text: g.effect + ' · ' + from, tone: g.tank ? 'danger' : g.heal ? 'success' : 'warn', running: true, time: '0:0' + G.int(3, 9) });
        Q.forEach(function (x, i) { if (i) x.running = false; }); Q = Q.slice(0, 4);
      }
      function hurt() {
        S.hp -= G.int(4, 14); G.send('game:damage', { angle: G.int(0, 359) });
        if (S.hp <= 0) { S.deaths++; S.losses++; S.hp = 100; S.streak = 0; G.send('game:announce', { kicker: 'Hayatta kalan', title: 'Öldün', sub: 'Bir dolapta bekliyorsun…', tone: 'danger' }); }
        T[0].hp = Math.max(1, S.hp); G.send('game:team', T);
      }
      setInterval(function () {
        var r = Math.random();
        if (r < .5) kill(); else if (r < .68) gift(); else if (r < .85) hurt();
        else if (r < .93) { var sp = G.pick(SPECIAL); G.send('game:infected', { name: sp.name, icon: sp.icon, hint: sp.hint }); }
        else if (!reviving) {
          reviving = true; var v = 0; G.set({ reviving: true, revive: 0, reviveLabel: 'MSK ayağa kaldırılıyor', reviver: 'Amiral Router · E basılı tut' });
          var iv = setInterval(function () { v += 10; G.set({ revive: v }); if (v >= 100) { clearInterval(iv); reviving = false; G.set({ reviving: false }); T[3].state = 'bw'; T[3].hp = 0; T[3].temp = 30; G.send('game:team', T); } }, 300);
        }
        if (!rescue && Math.random() < .08) { rescue = 1; G.set({ rescue: 90 }); G.send('game:toast', { tone: 'success', icon: 'heli', title: 'Telsiz', text: 'Helikopter 90 saniyede geliyor' }); }
        if (Math.random() < .1) G.send('game:social', { kind: G.pick(['join', 'follow', 'share', 'sub']), name: G.pick(NAMES) });
        G.set(S); G.send('game:queue', Q);
      }, 1300);
    }
  });
</script>
</body>
</html>
